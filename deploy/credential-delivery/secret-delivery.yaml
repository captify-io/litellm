AWSTemplateFormatVersion: '2010-09-09'
Description: Target-owned encrypted LiteLLM deployment secret and scoped publisher/reader permissions.
Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
  KmsKeyArn:
    Type: String
    AllowedPattern: 'arn:aws(-us-gov|-cn)?:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36}'
  DeploymentRoleName:
    Type: String
    AllowedPattern: '[A-Za-z0-9+=,.@_-]{1,64}'
  HostRoleName:
    Type: String
    AllowedPattern: '[A-Za-z0-9+=,.@_-]{1,64}'
  TargetInstanceId:
    Type: AWS::EC2::Instance::Id
Resources:
  DeploymentSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'litellm/deployment-${EnvironmentName}'
      Description: Serialized deployment envelope; current version is expired after CI completes.
      KmsKeyId: !Ref KmsKeyArn
      SecretString: '{"schemaVersion":1,"state":"expired"}'
      Tags:
        - Key: litellm:owner-repository
          Value: litellm
        - Key: litellm:environment
          Value: !Ref EnvironmentName
        - Key: litellm:purpose
          Value: target-side-deployment-secret-delivery
  PublisherPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'LiteLLMSecretPublisher-${EnvironmentName}'
      Roles: [!Ref DeploymentRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [secretsmanager:PutSecretValue, secretsmanager:DescribeSecret, secretsmanager:UpdateSecretVersionStage]
            Resource: !Ref DeploymentSecret
          - Effect: Allow
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: !Ref KmsKeyArn
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                'kms:EncryptionContext:SecretARN': !Ref DeploymentSecret
  ReaderPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'LiteLLMSecretReader-${EnvironmentName}'
      Roles: [!Ref HostRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenySharedHostRoleFromOtherInstances
            Effect: Deny
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DeploymentSecret
            Condition:
              ArnNotEquals:
                ec2:SourceInstanceARN: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DeploymentSecret
            Condition:
              StringEquals:
                secretsmanager:VersionStage: AWSCURRENT
              ArnEquals:
                ec2:SourceInstanceARN: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}'
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref KmsKeyArn
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                'kms:EncryptionContext:SecretARN': !Ref DeploymentSecret
              ArnEquals:
                ec2:SourceInstanceARN: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}'
  ReaderBoundary:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref DeploymentSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyHostHistoricalOrUnspecifiedStages
            Effect: Deny
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${HostRoleName}'
            Action: secretsmanager:GetSecretValue
            Resource: '*'
            Condition:
              StringNotEquals:
                secretsmanager:VersionStage: AWSCURRENT
Outputs:
  DeploymentSecretArn:
    Value: !Ref DeploymentSecret
  TargetInstanceArn:
    Value: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${TargetInstanceId}'
