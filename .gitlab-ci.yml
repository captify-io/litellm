# GitLab CI pipeline for build + SBOM/ATO artifacts + EC2 deployment

include:
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - sbom
  - package
  - release-gate
  - deploy

variables:
  DS_INCLUDE_DEV_DEPENDENCIES: "false"
  DS_ENFORCE_NEW_ANALYZER: "true"
  DOCKER_BUILDKIT: "1"
  CYCLONEDX_VERSION: "v0.29.1"
  CYCLONEDX_LINUX_MUSL_X64_SHA256: "526d55f67ac53744f45525f30f0f210d3a95e044b5073904cb3eacb8f8e52135"
  # Centralized CycloneDX JSON -> XLSX converter image (anautics-tools/cdx2xlsx)
  CDX2XLSX_IMAGE: "$CI_REGISTRY/anautics-tools/cdx2xlsx:1.0.1"
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"

build-wheel:
  stage: build
  image: python:3.12-slim-bookworm
  before_script:
    # litellm builds a Rust extension via maturin; it needs a C linker, and
    # maturin bootstraps its own Rust toolchain (requires rust-lang.org access).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev
    - python -m pip install --no-cache-dir "uv==0.11.7"
    - uv --version
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - when: always

build-image:
  stage: build
  before_script:
    - docker info
    - docker buildx version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - LITELLM_VERSION=$(grep '^version' pyproject.toml | head -1 | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
    - echo "$LITELLM_VERSION" > litellm_version.txt
    - |
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        --cache-from "$CI_REGISTRY_IMAGE:latest" \
        -f docker/Dockerfile.non_root \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
        --load \
        .
    - test "$(docker image inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --format '{{.Config.User}}')" = 65534
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      LITELLM_IMAGE=$(docker image inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --format '{{index .RepoDigests 0}}')
      case "$LITELLM_IMAGE" in "$CI_REGISTRY_IMAGE"@sha256:*) ;; *) exit 1 ;; esac
      printf 'LITELLM_IMAGE=%s\n' "$LITELLM_IMAGE" > release.env
  artifacts:
    reports:
      dotenv: release.env
    paths:
      - litellm_version.txt
      - release.env
    expire_in: 1 week
  rules:
    - when: always
  tags:
    - al2023-fips-shell

build-sbom-image:
  stage: build
  needs:
    - job: build-image
      artifacts: true
  before_script:
    - docker info
    - docker buildx version
  script:
    - LITELLM_VERSION=$(cat litellm_version.txt)
    - docker buildx build -f Dockerfile.sbom -t "litellm-sbom:$LITELLM_VERSION" --load .
    - SBOM_CONTAINER_ID=$(docker create "litellm-sbom:$LITELLM_VERSION")
    - docker cp "$SBOM_CONTAINER_ID":/sbom/build-sbom.json ./build-sbom.json
    - docker cp "$SBOM_CONTAINER_ID":/sbom/runtime-sbom.json ./runtime-sbom.json
    - docker rm "$SBOM_CONTAINER_ID"
  artifacts:
    paths:
      - build-sbom.json
      - runtime-sbom.json
    expire_in: 1 week
  rules:
    - when: always
  tags:
    - al2023-fips-shell

dashboard-sbom:
  stage: build
  # ui/litellm-dashboard declares engines node>=24.14.1 / npm>=11.10.0
  image: node:24
  before_script:
    - cd ui/litellm-dashboard
    - npm install -g @cyclonedx/cyclonedx-npm@4.0.0
    - npm ci
  script:
    - cyclonedx-npm --package-lock-only --output-file dashboard-sbom.json --output-format JSON --sv 1.6
    - mv dashboard-sbom.json ../../dashboard-sbom.json
  artifacts:
    paths:
      - dashboard-sbom.json
    expire_in: 1 week
  rules:
    - when: always

dependency-scanning:
  stage: test
  rules:
    - when: always

semgrep-sast:
  stage: test
  artifacts:
    paths:
      - gl-sast-report.json
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
  rules:
    - when: never

container_scanning:
  stage: test
  # Override the analyzer template default that disables build artifact downloads.
  dependencies:
    - build-image
  before_script:
    - 'test -n "$LITELLM_IMAGE"'
    - export CS_IMAGE="$LITELLM_IMAGE"
  variables:
    CS_IMAGE: "$LITELLM_IMAGE"
    SECURE_LOG_LEVEL: debug
    CI_GITLAB_FIPS_MODE: "false"
  needs:
    - job: build-image
      artifacts: true
    - job: dependency-scanning
      artifacts: true
      optional: true
  allow_failure: false
  artifacts:
    paths:
      - gl-container-scanning-report.json
      - gl-sbom*.cdx.json
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week
  rules:
    - when: always

merge-sbom:
  stage: sbom
  image: alpine:3.22
  variables:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  needs:
    - job: build-sbom-image
      artifacts: true
    - job: dashboard-sbom
      artifacts: true
    - job: container_scanning
      artifacts: true
    - job: dependency-scanning
      artifacts: true
  before_script:
    - apk add --no-cache curl libgcc libstdc++ python3
    - curl -fsSL -o ./cyclonedx "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_VERSION}/cyclonedx-linux-musl-x64"
    - echo "${CYCLONEDX_LINUX_MUSL_X64_SHA256}  ./cyclonedx" | sha256sum -c -
    - chmod +x ./cyclonedx
    - ./cyclonedx --version
  script:
    - CONTAINER_SBOM=$(ls gl-sbom*.cdx.json 2>/dev/null | head -1 || true)
    - '[ -n "$CONTAINER_SBOM" ] && echo "Using container SBOM: $CONTAINER_SBOM" || echo "WARNING: no container SBOM found; merging environment SBOMs only"'
    - |
      for TARGET in build runtime; do
        echo "Merging ${TARGET} SBOM..."
        ./cyclonedx merge \
          --input-files $CONTAINER_SBOM "${TARGET}-sbom.json" \
          --output-file "${TARGET}-sbom-merged.cdx.json" \
          --output-format json \
          --output-version v1_6
      done
    # The dashboard SBOM covers the npm workspace only, so it needs no container merge.
    - cp dashboard-sbom.json dashboard-sbom-merged.cdx.json
    - |
      if [ -f gl-dependency-scanning-report.json ]; then
        for TARGET in build runtime dashboard; do
          echo "Injecting vulnerabilities into ${TARGET} SBOM..."
          python3 scripts/sbom-vuln-injection.py \
            "${TARGET}-sbom-merged.cdx.json" \
            gl-dependency-scanning-report.json \
            "${TARGET}-sbom-enriched.cdx.json"
        done
      else
        echo "WARNING: gl-dependency-scanning-report.json not found; SBOMs will carry no vulnerability data"
        for TARGET in build runtime dashboard; do
          cp "${TARGET}-sbom-merged.cdx.json" "${TARGET}-sbom-enriched.cdx.json"
        done
      fi
  artifacts:
    paths:
      - build-sbom-enriched.cdx.json
      - runtime-sbom-enriched.cdx.json
      - dashboard-sbom-enriched.cdx.json
    expire_in: 1 week
  rules:
    - when: always

convert-sbom:
  stage: sbom
  image:
    name: $CDX2XLSX_IMAGE
    entrypoint: [""]
  needs:
    - job: merge-sbom
      artifacts: true
  before_script:
    - |
      if ! command -v cc >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          rm -rf /var/lib/apt/lists/*
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache build-base
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y gcc glibc-devel
          dnf clean all
        else
          echo "FATAL: converter image has no C compiler or supported package manager"
          exit 1
        fi
      fi
    - cc --version
  script:
    - |
      for TARGET in build runtime dashboard; do
        echo "Converting ${TARGET} SBOM to XLSX..."
        python /app/cdx2xlsx.py -i "${TARGET}-sbom-enriched.cdx.json" -o "${TARGET}-sbom.xlsx"
      done
  artifacts:
    paths:
      - build-sbom.xlsx
      - runtime-sbom.xlsx
      - dashboard-sbom.xlsx
    expire_in: 1 week
  rules:
    - when: always

package-documents:
  stage: package
  image: alpine:3.22
  needs:
    - job: build-image
      artifacts: true
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: dependency-scanning
      artifacts: true
      optional: true
    - job: container_scanning
      artifacts: true
      optional: true
    - job: merge-sbom
      artifacts: true
    - job: convert-sbom
      artifacts: true
  script:
    - mkdir -p "ci-documents-${CI_PIPELINE_ID}"
    - DATE=$(date +%m-%d-%Y)
    - LITELLM_VERSION=$(cat litellm_version.txt)
    - |
      if [ -f gl-sast-report.json ]; then
        cp gl-sast-report.json "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-gl-sast-report.json"
      fi
    - |
      if [ -f gl-dependency-scanning-report.json ]; then
        cp gl-dependency-scanning-report.json "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-gl-dependency-scanning-report.json"
      fi
    - |
      CONTAINER_SBOM=$(ls gl-sbom*.cdx.json 2>/dev/null | head -1)
      if [ -n "$CONTAINER_SBOM" ]; then
        cp "$CONTAINER_SBOM" "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-gl-container-sbom.json"
      fi
    - |
      if [ -f gl-container-scanning-report.json ]; then
        cp gl-container-scanning-report.json "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-gl-container-scanning-report.json"
      fi
    - |
      for TARGET in build runtime dashboard; do
        cp "${TARGET}-sbom-enriched.cdx.json" \
          "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-${TARGET}-sbom-${LITELLM_VERSION}.cdx.json"
        cp "${TARGET}-sbom.xlsx" \
          "ci-documents-${CI_PIPELINE_ID}/${DATE}_litellm-${TARGET}-sbom-${LITELLM_VERSION}.xlsx"
      done
    - ls -1 "ci-documents-${CI_PIPELINE_ID}/"
  artifacts:
    paths:
      - ci-documents-*
    expire_in: 90 days
  rules:
    - when: always

security-release-gate:
  stage: release-gate
  image: alpine:3.22
  needs:
    - job: container_scanning
      artifacts: true
  before_script:
    - apk add --no-cache bash jq
  script:
    - bash scripts/gate-container-vulnerabilities.sh gl-container-scanning-report.json

.deploy_template:
  stage: deploy
  needs:
    - job: build-image
      artifacts: true
    - job: package-documents
      artifacts: false
    - job: security-release-gate
      artifacts: false
  image: python:3.12-slim-bookworm
  resource_group: litellm-$CI_ENVIRONMENT_NAME
  interruptible: false
  before_script:
    - test "${CI_DEBUG_TRACE:-false}" != "true"
    - test "${DEBUG_DEPLOY_PASSWORD_FLOW:-false}" != "true"
    - python3 -m pip install --require-hashes -r deploy/credential-delivery/requirements.txt
  script:
    - python3 -m unittest discover -s tests/credential_delivery -v
    - python3 deploy/credential-delivery/publish.py

deploy-dev:
  extends: .deploy_template
  variables:
    DEPLOY_CONFIG: "$DEV_DEPLOYMENT_CONFIG"
    ENV_FILE: "$LITELLM_DEV_ENV"
  environment:
    name: dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

deploy-staging:
  extends: .deploy_template
  variables:
    DEPLOY_CONFIG: "$STAGING_DEPLOYMENT_CONFIG"
    ENV_FILE: "$LITELLM_STAGING_ENV"
  environment:
    name: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  when: manual

deploy-production:
  extends: .deploy_template
  variables:
    DEPLOY_CONFIG: "$PRODUCTION_DEPLOYMENT_CONFIG"
    ENV_FILE: "$LITELLM_PRODUCTION_ENV"
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  when: manual
