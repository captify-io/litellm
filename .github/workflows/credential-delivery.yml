name: Credential delivery boundaries

on:
  pull_request:
    paths:
      - deploy/credential-delivery/**
      - tests/credential_delivery/**
      - .gitlab-ci.yml
      - .github/workflows/credential-delivery.yml

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/credential_delivery -v
